<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234285F4' d='M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.373 12 12 0-6.627 5.373-12 12-12-6.627 0-12-5.373-12-12z'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@300;400;500&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <button
            class="icon-btn menu-btn"
            id="sidebar-toggle"
            title="Ciutkan menu"
            aria-label="Ciutkan menu"
          >
            <svg viewBox="0 0 24 24" class="icon">
              <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
            </svg>
          </button>

          <button class="new-chat-btn" id="new-chat-btn">
            <svg viewBox="0 0 24 24" class="icon plus-icon">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
            <span class="btn-text">Obrolan baru</span>
          </button>
        </div>

        <div class="sidebar-recent">
          <div class="recent-title">Terkini</div>
          <div class="recent-list" id="recent-list">
            <!-- Recent conversation items rendered by JS -->
          </div>
        </div>

        <div class="sidebar-footer">
          <button class="sidebar-footer-btn" id="clear-all-btn" title="Hapus semua riwayat">
            <svg viewBox="0 0 24 24" class="icon">
              <path
                d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1zM18 7H6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7z"
              />
            </svg>
            <span class="btn-text">Hapus riwayat</span>
          </button>
          <div class="sidebar-footer-info">
            <span class="gemini-location-dot"></span>
            <span class="location-text">Indonesia • Dari alamat IP Anda</span>
          </div>
        </div>
      </aside>

      <!-- Sidebar Overlay for mobile -->
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Header -->
        <header class="top-nav">
          <div class="nav-left">
            <button
              class="icon-btn mobile-menu-btn"
              id="mobile-menu-btn"
              title="Buka menu"
              aria-label="Buka menu"
            >
              <svg viewBox="0 0 24 24" class="icon">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
              </svg>
            </button>
            <div class="model-badge">
              <span class="gemini-logo-text">Gemini</span>
              <span class="model-version">Advanced</span>
              <svg viewBox="0 0 24 24" class="icon chevron-icon"><path d="M7 10l5 5 5-5z" /></svg>
            </div>
          </div>
          <div class="nav-right">
            <button class="gemini-sparkle-pill" id="sparkle-pill" title="Gemini Web Service">
              <svg viewBox="0 0 24 24" class="sparkle-svg">
                <path
                  d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.373 12 12 0-6.627 5.373-12 12-12-6.627 0-12-5.373-12-12z"
                />
              </svg>
              <span>Tingkatkan</span>
            </button>
            <div class="user-avatar" title="Akun Pengguna">
              <span>U</span>
            </div>
          </div>
        </header>

        <!-- Chat Scrollable Body -->
        <div class="chat-viewport" id="chat-viewport">
          <!-- Welcome Screen (Shown when empty) -->
          <section class="welcome-screen" id="welcome-screen">
            <div class="welcome-header">
              <h1 class="welcome-greeting">
                <span class="gradient-text">Halo, Selamat Datang</span>
              </h1>
              <p class="welcome-subtitle">Ada yang bisa saya bantu hari ini?</p>
            </div>

            <div class="suggestion-grid">
              <button
                class="suggestion-card"
                data-prompt="Jelaskan apa itu Web Service dan bagaimana cara kerja RESTful API secara sederhana."
              >
                <p class="suggestion-text">
                  Jelaskan apa itu Web Service & RESTful API secara sederhana
                </p>
                <div class="card-icon-wrapper">
                  <svg viewBox="0 0 24 24" class="icon">
                    <path
                      d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
                    />
                  </svg>
                </div>
              </button>

              <button
                class="suggestion-card"
                data-prompt="Buatkan contoh kode JavaScript Express.js untuk membuat endpoint REST API streaming SSE."
              >
                <p class="suggestion-text">
                  Buatkan contoh kode Express.js untuk Server-Sent Events (SSE)
                </p>
                <div class="card-icon-wrapper">
                  <svg viewBox="0 0 24 24" class="icon">
                    <path
                      d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"
                    />
                  </svg>
                </div>
              </button>

              <button
                class="suggestion-card"
                data-prompt="Berikan tips dan rencana belajar agar cepat memahami arsitektur Microservices."
              >
                <p class="suggestion-text">Tips & rencana belajar arsitektur Microservices</p>
                <div class="card-icon-wrapper">
                  <svg viewBox="0 0 24 24" class="icon">
                    <path
                      d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"
                    />
                  </svg>
                </div>
              </button>

              <button
                class="suggestion-card"
                data-prompt="Bantu saya membuat ide proyek tugas praktikum Web Service yang menarik dan aplikatif."
              >
                <p class="suggestion-text">
                  Bantu brainstorming ide proyek Web Service yang kreatif
                </p>
                <div class="card-icon-wrapper">
                  <svg viewBox="0 0 24 24" class="icon">
                    <path
                      d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6C7.8 12.16 7 10.63 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"
                    />
                  </svg>
                </div>
              </button>
            </div>
          </section>

          <!-- Messages Area (Shown when messages exist) -->
          <div class="messages-container" id="messages-container"></div>
        </div>

        <!-- Bottom Input Floating Box -->
        <footer class="input-area-wrapper">
          <div class="input-box-container" id="input-box-container">
            <div class="input-row">
              <textarea
                id="prompt-input"
                class="prompt-textarea"
                placeholder="Tanya Gemini..."
                rows="1"
                autocomplete="off"
              ></textarea>

              <div class="input-actions-right">
                <button
                  class="icon-btn tool-btn"
                  id="mic-btn"
                  title="Input suara (opsional)"
                  aria-label="Input suara"
                >
                  <svg viewBox="0 0 24 24" class="icon">
                    <path
                      d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"
                    />
                  </svg>
                </button>

                <button
                  class="send-btn"
                  id="send-btn"
                  disabled
                  title="Kirim pesan"
                  aria-label="Kirim pesan"
                >
                  <svg viewBox="0 0 24 24" class="icon send-icon">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                  </svg>
                  <svg viewBox="0 0 24 24" class="icon stop-icon"><path d="M6 6h12v12H6z" /></svg>
                </button>
              </div>
            </div>
          </div>

          <div class="disclaimer-text">
            Gemini dapat menampilkan informasi yang tidak akurat, termasuk tentang orang, jadi
            periksa kembali responsnya.
          </div>
        </footer>
      </main>
    </div>

    <div class="toast-notification" id="toast-notification"></div>

    <script src="script.js"></script>
  </body>
</html>
